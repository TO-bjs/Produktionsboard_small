{% extends 'base.html' %}

{% block title %}Produktionsboard Startseite{% endblock %}

{% block content %}
<video id="background-video" autoplay muted loop playsinline class="position-fixed w-100 h-100 object-fit-cover bg-video" aria-hidden="true"></video>

<div class="container text-center mt-5">
  <h1 class="mb-4 display-4">Willkommen beim Digitalen Produktionsboard</h1>

  <div id="announcement-container" class="container mt-4 d-flex justify-content-center">
    <div id="announcement-card" class="card app-card app-card--announcement p-4 shadow">
      <div id="announcement-content-wrapper" class="transition-slide d-flex flex-column align-items-center text-center">
        <h5 class="card-title fw-bold text-primary" id="announcement-title"></h5>
        <p class="card-text" id="announcement-content"></p>
        <p class="card-subtitle text-muted" id="announcement-source"></p>
        <div id="announcement-image" class="mt-3 announcement-image"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let announcements = [];
  let index = 0;

  const wrapper = document.getElementById("announcement-content-wrapper");
  const imgContainer = document.getElementById('announcement-image');
  let fetchInterval = null;
  let slideInterval = null;

  async function fetchAnnouncements() {
    try {
      const res = await fetch('/api/announcements');
      if (!res.ok) return;
      const data = await res.json();

      if (JSON.stringify(data) !== JSON.stringify(announcements)) {
        announcements = data;
        index = 0;
        showNext(true);

        if (announcements.length > 1) {
          if (slideInterval) clearInterval(slideInterval);
          slideInterval = setInterval(() => showNext(false), 5000);
        } else {
          if (slideInterval) clearInterval(slideInterval);
          slideInterval = null;
        }
      }
    } catch (err) {
      console.error("Fehler beim Laden der Ankündigungen:", err);
    }
  }

  function showNext(initial = false) {
    if (announcements.length === 0) return;

    if (announcements.length === 1) {
      const a = announcements[0];
      document.getElementById('announcement-title').textContent = a.title;
      document.getElementById('announcement-content').textContent = a.content;
      document.getElementById('announcement-source').textContent = "Quelle: " + a.source;
      if (a.attachment_path) {
        imgContainer.innerHTML = `<img src="/uploads/${a.attachment_path}" class="img-fluid rounded shadow-sm" alt="Anhang zur Ankündigung">`;
      } else {
        imgContainer.innerHTML = '';
      }
      return;
    }

    wrapper.classList.remove("slide-in");
    if (!initial) wrapper.classList.add("slide-out");

    setTimeout(() => {
      const a = announcements[index];
      document.getElementById('announcement-title').textContent = a.title;
      document.getElementById('announcement-content').textContent = a.content;
      document.getElementById('announcement-source').textContent = "Quelle: " + a.source;

      if (a.attachment_path) {
        imgContainer.innerHTML = `<img src="/uploads/${a.attachment_path}" class="img-fluid rounded shadow-sm" alt="Anhang zur Ankündigung">`;
      } else {
        imgContainer.innerHTML = '';
      }

      wrapper.classList.remove("slide-out");
      void wrapper.offsetWidth;
      wrapper.classList.add("slide-in");
      index = (index + 1) % announcements.length;
    }, initial ? 0 : 500);
  }

  function adjustAnnouncementHeight() {
    const navbar = document.querySelector('.navbar');
    const navHeight = navbar ? navbar.offsetHeight : 60;
    const availableHeight = window.innerHeight - navHeight - 60;
    const maxHeight = Math.min(availableHeight, window.innerWidth < 576 ? 520 : 680);
    const minHeight = Math.max(240, availableHeight * 0.55);

    const card = document.getElementById('announcement-card');
    if (card) {
      card.style.minHeight = minHeight + 'px';
      card.style.maxHeight = maxHeight + 'px';
    }
  }

  adjustAnnouncementHeight();
  let announcementResizeTimeout;
  window.addEventListener('resize', function() {
    clearTimeout(announcementResizeTimeout);
    announcementResizeTimeout = setTimeout(adjustAnnouncementHeight, 100);
  });

  fetchAnnouncements();
  fetchInterval = setInterval(fetchAnnouncements, 10000);

  const videoPaths = ["/static/video4.mp4", "/static/video2.mp4", "/static/video3.mp4"];
  let vIndex = 0;
  const videoEl = document.getElementById("background-video");
  videoEl.src = videoPaths[vIndex];
  videoEl.play();

  setInterval(() => {
    vIndex = (vIndex + 1) % videoPaths.length;
    videoEl.pause();
    videoEl.src = videoPaths[vIndex];
    videoEl.load();
    videoEl.play();
  }, 30000);
</script>
{% endblock %}
