{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="text-center mt-5">
  <h1 class="display-4">📺 Dashboard startet...</h1>
  <p class="lead">Vollbild wird aktiviert, dann beginnt die Slideshow.</p>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/slideshow.js"></script>
<script>
  // Starte Vollbildmodus, wenn erlaubt
  function enterFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
  }

  // Initial: Vollbild + Start Slideshow auf definierter Startseite
  document.addEventListener("DOMContentLoaded", function () {
    enterFullscreen();
    setTimeout(() => {
      window.location.href = SlideshowFlow.getStartUrl();
    }, 1000);
  });
</script>
{% endblock %}
