{% extends 'base.html' %}
{% block title %}Schulungskalender{% endblock %}
{% block content %}
<section class="page-shell" aria-labelledby="trainings-title">
  <header class="page-header">
    <p class="eyebrow">Phase 2 · UI-Redesign</p>
    <h1 id="trainings-title">Schulungen</h1>
  </header>

  <div class="trainings-layout">
    <article class="app-card p-3">
      <h2 class="h5">Nächste 30 Tage</h2>
      <div class="toolbar"><input id="training-filter" class="form-control" type="search" placeholder="Suche Titel/Teilnehmer" aria-label="Schulungen durchsuchen"></div>
      <ul class="list-group" id="upcoming-list" aria-live="polite"><li class="list-group-item">Lade Daten…</li></ul>
    </article>
    <article class="app-card p-3">
      <h2 class="h5">Zeitachse</h2>
      <div id="calendar" class="calendar-shell" aria-label="Schulungskalender"></div>
    </article>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>window.AppUI.initTrainings();</script>
{% endblock %}
