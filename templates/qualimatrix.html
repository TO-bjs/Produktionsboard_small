{% extends 'base.html' %}
{% block title %}Qualimatrix{% endblock %}
{% block content %}
<section class="page-shell" aria-labelledby="qm-title">
  <header class="page-header page-header--split">
    <div><p class="eyebrow">Phase 3 · Interaktion</p><h1 id="qm-title">Qualimatrix</h1></div>
    <div class="toolbar"><button type="button" class="btn btn-outline-secondary btn-sm view-toggle" data-view="slider">Slider</button><button type="button" class="btn btn-outline-secondary btn-sm view-toggle" data-view="grid">Raster</button></div>
  </header>

  <div class="app-card p-3">
    {% if all_images %}
      <div class="qm-view qm-view-slider" id="qm-slider-wrap">
        <figure class="qm-card"><img id="qm-hero-img" class="qm-media" src="{{ all_images[0].src }}" alt="Qualimatrix Bild"><figcaption id="qm-hero-caption">{{ all_images[0].label }} – {{ all_images[0].name }}</figcaption></figure>
      </div>
      <div class="qm-view qm-view-grid d-none" id="qm-grid-wrap">
        <div class="two-col-grid">
          {% for img in all_images %}<figure class="qm-card"><img src="{{ img.src }}" alt="{{ img.label }} {{ img.name }}" class="qm-media"><figcaption>{{ img.label }} – {{ img.name }}</figcaption></figure>{% endfor %}
        </div>
      </div>
    {% else %}
      <p class="status-message status-message--info">Keine Daten vorhanden.</p>
    {% endif %}
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
window.AppUI.initQualiMatrix([
{% for img in all_images %}{ src: "{{ img.src }}", label: "{{ img.label|e }}", name: "{{ img.name|e }}" }{% if not loop.last %},{% endif %}{% endfor %}
]);
</script>
{% endblock %}
