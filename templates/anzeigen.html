{% extends 'base.html' %}

{% block title %}Feinterminierung{% endblock %}

{% block content %}
<div class="container-fluid d-flex flex-column" style="padding: 0.5rem; gap: 0.5rem; height: auto;">
  <div class="d-flex justify-content-between align-items-center">
    <h2 id="ft-head" class="mb-0" style="font-size: 1.5rem;">📊 Aktuelle Feinterminierung</h2>
  </div>

  <div class="screen-fit" style="flex-grow: 1; overflow: hidden;">
    <img id="ft-img" src="/uploads/screenshot.png?ts={{ timestamp }}" alt="Screenshot" class="fit-image">
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    function fit() {
      const navbar = document.querySelector('.navbar');
      const container = document.querySelector('.container-fluid');
      const head = document.getElementById('ft-head');
      const screenFit = document.querySelector('.screen-fit');

      // Navbar + Containerpadding
      const navHeight = navbar ? navbar.offsetHeight : 60;
      const containerStyle = window.getComputedStyle(container);
      const containerPadding = parseFloat(containerStyle.paddingTop || 0) + parseFloat(containerStyle.paddingBottom || 0);
      
      // Head-Höhe + gap
      let headHeight = head ? head.offsetHeight : 30;
      const gap = 8; // gap: 0.5rem
      
      // Verfügbare Höhe für Image
      const totalUsed = navHeight + containerPadding + headHeight + gap + 10; // 10px safety
      const availableHeight = Math.max(300, window.innerHeight - totalUsed);
      
      if (screenFit) {
        screenFit.style.height = availableHeight + 'px';
        screenFit.style.maxHeight = availableHeight + 'px';
      }
    }

    const params = new URLSearchParams(location.search);

    window.addEventListener('load', fit);
    window.addEventListener('resize', fit);
    setTimeout(fit, 100); // Initial aus JS
  })();

  // Dashboard-Weiterleitung (wie auf deinen anderen Seiten)
  (function () {
    const params = new URLSearchParams(window.location.search);
    if (params.get("slideshow") !== "1") return;

    const path = window.location.pathname.replace(/\/+$/, "");
    const nextPages = {
      "/landing":     "/anzeige?slideshow=1",
      "/anzeige":     "/schulungen?slideshow=1",
      "/schulungen": "/landing?slideshow=1"
    };
    const next = nextPages[path];
    if (next) setTimeout(() => { window.location.href = next; }, 60000);
  })();
</script>
{% endblock %}
