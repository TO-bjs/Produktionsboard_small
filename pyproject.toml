[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "produktionsboard-small"
version = "0.1.0"
description = "Abgespecktes Produktionsboard"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.1",
  "Flask-WTF==1.2.2",
  "waitress==3.0.2",
  "Werkzeug==3.1.3",
  "alembic==1.16.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
